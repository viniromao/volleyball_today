name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: build
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -buildvcs=false -o volei-hoje-bot .

      - name: chave ssh
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: deploy
        env:
          ALVO: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
        run: |
          scp -o BatchMode=yes volei-hoje-bot "$ALVO:/opt/volei-hoje-bot/volei-hoje-bot.novo"
          ssh -o BatchMode=yes "$ALVO" '
            set -e
            chmod 755 /opt/volei-hoje-bot/volei-hoje-bot.novo
            mv /opt/volei-hoje-bot/volei-hoje-bot.novo /opt/volei-hoje-bot/volei-hoje-bot
            sudo systemctl restart volei-hoje-bot
            sleep 5
            sudo systemctl is-active volei-hoje-bot
          '
